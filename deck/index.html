<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дхармачакра</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Design tokens (overridden per theme.json via JS) ── */
    :root {
      --accent:                  #C9773D;
      --accent-light:            #E8A87C;
      --slide-bg:                #14161f;
      --bg-card:                 #1E2030;
      --text-main:               #F2EEE6;
      --text-muted:              #9DA3B4;
      --song-translit-color:     #F2EEE6;
      --song-translation-color:  #C9C4D4;
      --font-heading:            Manrope, sans-serif;
      --font-body:               Manrope, sans-serif;
      --panel-bg:                #1E2030;
      --panel-radius:            14px;
      --news-panel-bg:           #EDE8DF;
      --news-panel-text:         #12141f;
      --featured-bg:             #2A211A;
      --featured-border:         #C9773D;
      --footer-opening-bg:       #C0392B;
      --footer-continuation-bg:  #2D5A8E;
    }

    /* ── Reveal base ── */
    .reveal-viewport { background: var(--slide-bg); }
    .reveal .slides { height: 100%; }
    .reveal .slides section {
      height: 100%;
      color: var(--text-main);
      font-family: var(--font-body);
      text-align: left;
      padding: 0;
      box-sizing: border-box;
      background: var(--slide-bg);
    }
    .reveal h1, .reveal h2, .reveal h3 {
      font-family: var(--font-heading);
      color: var(--text-main);
      text-align: left;
      text-transform: none;
      letter-spacing: normal;
      margin: 0 0 0.6rem;
    }

    /* ── Offline banner ── */
    #dc-banner {
      position: fixed; top: 0; left: 0; right: 0;
      background: #7B3A20; color: #F2EEE6;
      text-align: center; font-size: 0.8rem; padding: 0.4rem 1rem;
      z-index: 9999; font-family: Manrope, sans-serif;
    }

    /* ── Shared layout ── */
    /* !important beats .reveal .slides section (specificity 0,2,1 > 0,1,0) */
    .dc-slide {
      display: grid !important;
      height: 100%;
      padding: 2.6rem 3rem;
      box-sizing: border-box;
    }
    .dc-label {
      font-size: 0.6rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .dc-divider {
      border: none; border-top: 1px solid var(--accent);
      opacity: 0.25; margin: 0.8rem 0;
    }
    .dc-stub { color: var(--text-muted); font-style: italic; opacity: 0.7; }

    /* ── INFO slide ── */
    /* fixed % so left column is never squeezed by right-side content */
    .slide-info { grid-template-columns: 56% 44%; gap: 1.6rem; position: relative; }

    /* background-music toggle: OVERLAY pill in the bottom-left corner (no layout row).
       Auto-hides on idle in the show. Content stays visible — hidden player (boot.js). */
    .info-music-btn {
      position: absolute; left: 1.5rem; bottom: 0.9rem; z-index: 100;   /* above all slide content */
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(20,22,31,0.92); color: var(--accent-light);      /* opaque → floats clearly on top */
      border: 1px solid var(--accent); border-radius: 999px;
      padding: 0.32rem 0.75rem 0.32rem 0.6rem;
      font-family: var(--font-body); font-size: 0.72rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, opacity 0.15s;
    }
    .info-music-btn:hover     { background: rgba(35,38,58,0.96); }
    .info-music-btn.playing   { background: var(--accent); color: #fff; border-color: transparent; }
    .info-music-btn.unavailable { opacity: 0.35; pointer-events: none; }   /* player didn't come up (no VPN) */
    .info-music-ico { font-size: 0.8rem; line-height: 1; }

    /* base dark panel (greeting, progress) */
    .info-panel {
      background: var(--panel-bg, #1E2030);
      border-radius: var(--panel-radius, 14px);
      padding: 0.95rem 1.1rem;
    }

    /* ── LEFT COLUMN: 5-row grid ──
       rows: greeting | prog-label | prog-items(1fr) | footer | progress
       row-gap:0 so label+items share one visual panel; spacing via margin-bottom */
    .info-left {
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      row-gap: 0;
      min-height: 0;
    }

    .info-greeting-panel {
      text-align: center; padding: 1rem 1.2rem;
      margin-bottom: 0.55rem;
    }
    .greeting-main { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
    .greeting-sub  { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem; }
    .maunavrata    { color: var(--accent); font-weight: 700; }

    /* program label: top half of unified dark panel */
    .info-program-label {
      background: var(--panel-bg, #1E2030);
      border-radius: var(--panel-radius, 14px) var(--panel-radius, 14px) 0 0;
      padding: 0.75rem 1.1rem 1rem;
      font-size: 1rem; font-weight: 700;
      color: var(--accent-light, #E8A87C);
    }
    /* program items: bottom half — 1fr row fills remaining column height */
    .info-program-items {
      background: var(--panel-bg, #1E2030);
      border-radius: 0 0 var(--panel-radius, 14px) var(--panel-radius, 14px);
      padding: 0 1.1rem 0.75rem;
      min-height: 0; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-start; gap: 1rem;
      margin-bottom: 0.55rem;
    }
    .program-item {
      display: grid;
      grid-template-columns: 4.1rem 1fr;
      column-gap: 0.55rem;
    }
    .program-item .time       { color: var(--accent); font-weight: 700; font-size: 1.2rem; }
    .program-item .prog-title { font-size: 1.2rem; line-height: 1.3; }
    .program-item .prog-note  { grid-column: 2; font-size: 0.85rem; color: var(--text-muted); font-style: italic; margin-top: 0.07rem; }

    .info-footer-bar {
      border-radius: var(--panel-radius, 14px);
      padding: 0.65rem 1rem;
      display: flex; align-items: center; gap: 0.55rem;
      font-size: 0.8rem; color: #fff; font-weight: 600; line-height: 1.3;
    }
    .info-footer-bar.footer-opening      { background: var(--footer-opening-bg, #C0392B); }
    .info-footer-bar.footer-continuation { background: var(--footer-continuation-bg, #2D5A8E); }
    .footer-icon { font-size: 1.05rem; flex-shrink: 0; }

    /* progress: row 5 — collapses to 0 height when plan absent */
    .info-progress-panel { margin-top: 0.55rem; }
    .progress-top-row    { display: flex; justify-content: space-between; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-muted); margin-bottom: 0.15rem; }
    .progress-amounts    { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.45rem; }
    .progress-raised     { font-size: 1.45rem; font-weight: 700; }
    .progress-plan       { font-size: 0.88rem; color: var(--footer-opening-bg, #C0392B); font-weight: 700; }
    .progress-track      { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.35); overflow: hidden; }
    .progress-fill       { height: 100%; background: #27AE60; }
    .progress-pct        { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 0.3rem; }

    /* ── RIGHT COLUMN: flex column — news (auto) then bottom (max 50%) ── */
    .info-right {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 0;
    }

    /* news: natural height, does not grow */
    .info-news-panel {
      flex: 0 0 auto;
      background: var(--news-panel-bg, #EDE8DF);
      border-radius: var(--panel-radius, 14px);
      padding: 1.1rem 1.2rem;
      color: var(--news-panel-text, #12141f);
      overflow: hidden;
      margin-right: 0.7rem;    /* small breathing room from the right edge */
    }
    .news-panel-title    { font-size: 1rem; font-weight: 700; line-height: 1.2; margin-bottom: 0.3rem; }
    .news-panel-subtitle { font-size: 0.72rem; color: rgba(18,20,31,0.45); line-height: 1.3; margin-bottom: 0.75rem; }
    .news-panel-list     { list-style: disc; padding-left: 1.15rem; margin: 0; }
    .news-panel-list li  { font-size: 0.9rem; line-height: 1.4; padding: 0.32rem 0; }
    .news-panel-list li:not(:last-child) { border-bottom: 1px solid rgba(18,20,31,0.07); }
    .news-panel-empty    { font-size: 0.88rem; color: rgba(18,20,31,0.45); font-style: italic; }

    /* featured (important) news: accent callout between news panel and jha zone.
       natural height, does not grow; absent → element not rendered at all */
    .info-featured-panel {
      flex: 0 0 auto;
      background: var(--featured-bg, #2A211A);
      border: 1px solid var(--featured-border, #C9773D);
      border-left: 4px solid var(--featured-border, #C9773D);
      border-radius: var(--panel-radius, 14px);
      padding: 0.7rem 1rem;
      margin-right: 0.7rem;    /* align with the news panel's right breathing room */
    }
    .featured-list    { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
    .featured-list li { display: flex; align-items: flex-start; gap: 0.5rem; font-size: 0.92rem; line-height: 1.35; color: var(--text-main); }
    .featured-icon    { color: var(--featured-border, #C9773D); flex-shrink: 0; font-size: 0.95rem; line-height: 1.4; }

    /* bottom zone: default 50% of right column, shrinks when news grows, pinned to bottom */
    /* position:relative so the speech bubble can float over the right (QR) area */
    .info-bottom {
      position: relative;
      flex: 0 1 50%;
      margin-top: auto;        /* push to bottom of right column */
      display: flex;
      align-items: flex-end;   /* character and QR sit on the baseline */
      gap: 0.9rem;
      min-height: 0;
    }

    /* character container: fills the zone height, image pinned to the bottom */
    .jha-cell {
      flex: 1;
      min-width: 0; min-height: 0;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    /* height:100% + width:auto → character is as tall as its container */
    .jha-cell img {
      height: 100%;
      width: auto;
      object-fit: contain;
      object-position: bottom center;
      display: block;
    }

    /* comic speech bubble: an oval cloud floating above the QR block, tail down to the character */
    .jha-bubble {
      position: absolute;
      top: -6%;
      right: 3rem;
      width: 172px; height: 130px;     /* width > height → ellipse */
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      box-sizing: border-box;
      padding: 0 20px;
      background: #fff; color: #12141f;
      font-size: 1rem; font-weight: 700; line-height: 1.15;
      overflow: visible;               /* tail must escape the ellipse boundary */
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.28));
      z-index: 2;
    }
    /* tail: a left-pointing triangle sitting at the bottom-left of the ellipse */
    .jha-bubble::after {
      content: '';
      position: absolute;
      /* at left:30px the ellipse boundary is ~bottom:10px, so bottom:-18px overlaps by ~8px */
      left: -14px;
      bottom: 12px;
      transform: rotate(-15deg);
      transform-origin: right center;
      top: auto;
      width: 0; height: 0;
      /* ◀ left-pointing triangle: right wall = solid, top+bottom = transparent */
      border-top:    20px solid transparent;
      border-bottom: 10px solid transparent;
      border-right:  52px solid #fff;       /* long arm → tip well to the LEFT of the bubble */
      border-left:   0;
    }

    /* QR: square anchored bottom-right */
    .qr-wrap {
      flex: 0 0 auto;
      align-self: flex-end;
      height: 55%;
      aspect-ratio: 1;
      margin-right: 1rem;
      background: #fff;                 /* light bg → QR always scannable */
      border-radius: 10px;
      overflow: hidden;
      padding: 6px;                     /* quiet zone around the code */
      box-sizing: border-box;
    }
    .qr-image { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── SONG slide ── */
    .slide-song {
      grid-template-rows: auto auto 1fr;
      background-size: cover; background-position: center;
      position: relative;
    }
    .slide-song::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(20,22,31,0.88) 0%, rgba(20,22,31,0.72) 100%);
    }
    .song-header { position: relative; z-index: 1; }
    .song-number { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem; }
    .song-title { font-size: 1.35rem; font-weight: 700; margin: 0 0 0.2rem; }
    .song-subtitle { font-size: 0.82rem; color: var(--text-muted); font-style: italic; margin-bottom: 0.6rem; }
    .song-body {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr 1fr; gap: 1.8rem;
      overflow: hidden;
    }
    .song-col-label { font-size: 0.55rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
    .stanza { margin-bottom: 1rem; }
    .stanza-line { font-size: 0.88rem; line-height: 1.65; }
    .stanza-line.translit { color: var(--song-translit-color); }
    .stanza-line.transl { color: var(--song-translation-color); font-style: italic; }
    .song-footnote { position: relative; z-index: 1; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.8rem; font-style: italic; }

    /* image-backed song: full-slide picture, contained, dark letterbox */
    .slide-song-image { padding: 0; place-items: center; position: relative; background: var(--slide-bg); }
    .slide-song-image img {
      position: relative; z-index: 1;
      max-width: 100%; max-height: 100%;
      object-fit: contain; display: block;
    }
    .song-image-fallback {
      position: absolute; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-style: italic; font-size: 0.9rem;
    }

    /* ── VIDEO slide ── */
    /* gap instead of iframe margin-top so the row never overflows and clips the link */
    .slide-video { grid-template-rows: auto 1fr auto; gap: 0.8rem; position: relative; }
    .slide-video iframe { width: 100%; height: 100%; border: none; border-radius: 6px; }

    /* On-slide nav arrows for iframe slides: the YouTube iframe swallows arrow KEYS
       once focused, but never mouse clicks on a parent element stacked above it.
       These buttons sit in the dark padding at each edge → click = prev/next slide. */
    .slide-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      z-index: 5;
      width: 3.2rem; height: 3.2rem; border-radius: 50%;
      background: rgba(20,22,31,0.6); color: #fff;
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 1.9rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.5; transition: opacity 0.15s; padding: 0 0 0.15rem;
    }
    .slide-nav:hover { opacity: 1; }
    .slide-nav-prev { left: 0.7rem; }
    .slide-nav-next { right: 0.7rem; }
    /* fallback: a real button, always fully visible — the way out when YouTube refuses to embed */
    .video-fallback {
      justify-self: start;
      display: inline-flex; align-items: center; gap: 0.45rem;
      font-size: 0.9rem; font-weight: 600;
      color: var(--text-main); text-decoration: none;
      background: var(--bg-card);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 0.5rem 1rem;
      transition: background 0.15s, color 0.15s;
    }
    .video-fallback:hover { background: var(--accent); color: #fff; }

    /* ── DADA slide ── */
    /* comment 2/3 · photo 1/3 */
    .slide-dada { grid-template-columns: 2fr 1fr; gap: 2.8rem; align-items: center; padding-left: 9rem; padding-right: 9rem; }
    .dada-comment { font-size: 1.5rem; line-height: 1.8; font-style: italic; }
    /* large circular photo filling its 1/3 column; fallback shows if assets/dada.jpg is absent */
    .dada-photo {
      position: relative; flex-shrink: 0; justify-self: center;
      width: min(100%, 400px); aspect-ratio: 1;
      border-radius: 50%; overflow: hidden;
    }
    .dada-photo img {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .dada-photo-fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); border: 2px dashed rgba(201,119,61,0.35);
      border-radius: 50%;
      font-size: 0.72rem; color: var(--text-muted); text-align: center; line-height: 1.4;
    }

    /* ── MUSIC slide ── */
    .slide-music { grid-template-rows: auto 1fr auto; gap: 0.8rem; position: relative; }
    .slide-music iframe { width: 100%; height: 100%; border: none; border-radius: 6px; }

    /* ── Corner controls: unobtrusive, never cover slide content ── */
    .dc-corner-btns {
      position: fixed; top: 0.7rem; right: 0.8rem; z-index: 9998;
      display: flex; gap: 0.4rem;
    }
    .dc-corner-btn {
      width: 2rem; height: 2rem; border-radius: 50%;
      background: rgba(30,32,48,0.55); color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 1rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.4; transition: opacity 0.15s, color 0.15s;
      font-family: var(--font-body);
    }
    .dc-corner-btn:hover { opacity: 1; color: var(--text-main); }
    /* play = start the show (fullscreen + slide 1); accented so it reads as primary.
       SVG triangle (centroid at the viewBox centre) → perfectly centred in the circle. */
    .dc-play-btn {
      background: var(--accent); color: #fff; border-color: transparent;
      opacity: 0.85;
    }
    .dc-play-btn:hover { opacity: 1; color: #fff; }
    .dc-play-btn svg { display: block; }
    /* in the show (fullscreen) the play/help buttons are redundant — only ⛶ (exit) stays */
    body.dc-fs .dc-help-btn,
    body.dc-fs .dc-play-btn { display: none; }

    /* ── Hotkeys help panel ── */
    .dc-help {
      position: fixed; inset: 0; z-index: 10001;
      background: rgba(10,11,16,0.72);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body);
    }
    .dc-help[hidden] { display: none; }
    .dc-help-card {
      background: var(--bg-card); color: var(--text-main);
      border: 1px solid var(--accent);
      border-radius: 16px; padding: 1.6rem 2rem; min-width: 280px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .dc-help-card h3 { color: var(--accent); font-size: 1.05rem; margin: 0 0 1rem; }
    .dc-help-dl { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.3rem; }
    .dc-help-dl > div { display: flex; align-items: baseline; gap: 0.9rem; }
    .dc-help-key {
      flex-shrink: 0; min-width: 3.4rem; text-align: center;
      background: var(--slide-bg); border: 1px solid rgba(201,119,61,0.4);
      border-radius: 6px; padding: 0.2rem 0.5rem;
      font-size: 0.82rem; font-weight: 700; color: var(--accent-light);
    }
    .dc-help-desc { font-size: 0.9rem; color: var(--text-main); }
    .dc-help-close {
      width: 100%; background: none; border: 1px solid rgba(201,119,61,0.35);
      border-radius: 8px; color: var(--text-muted); font-family: inherit;
      font-size: 0.85rem; padding: 0.5rem; cursor: pointer;
    }
    .dc-help-close:hover { color: var(--text-main); border-color: var(--accent); }

    /* ── Slide filmstrip (bottom thumbnails) ── */
    :root { --strip-h: 122px; }
    /* deck shrinks above the strip → thumbnails never cover slide content (normal mode).
       In fullscreen the strip is removed and the deck reclaims full height. */
    body.dc-strip-on .reveal { height: calc(100% - var(--strip-h)); }
    .dc-filmstrip {
      position: fixed; left: 0; right: 0; bottom: 0; height: var(--strip-h);
      z-index: 9997;
      display: flex; gap: 0.5rem; align-items: center;
      padding: 0.5rem 0.7rem;
      background: rgba(12,13,20,0.94);
      border-top: 1px solid rgba(255,255,255,0.08);
      overflow-x: auto; overflow-y: hidden;
    }
    .dc-filmstrip.hidden { display: none; }
    .dc-thumb {
      flex: 0 0 auto; position: relative;
      padding: 0; border: 2px solid transparent; border-radius: 6px;
      background: var(--slide-bg); overflow: hidden; cursor: pointer; outline: none;
    }
    .dc-thumb:hover { border-color: rgba(201,119,61,0.55); }
    .dc-thumb.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .dc-thumb-inner { transform-origin: top left; pointer-events: none; overflow: hidden; }
    .dc-thumb-num {
      position: absolute; bottom: 2px; left: 3px; z-index: 2;
      font-size: 0.6rem; font-weight: 700; color: #fff;
      background: rgba(0,0,0,0.55); border-radius: 3px; padding: 0 0.25rem; pointer-events: none;
    }
    .dc-thumb-iframe {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: #000; color: var(--accent-light); font-size: 4rem;
    }

    /* ── Cinema mode: fills the viewport with a PLAYING video (or a shown song image).
       The deck keeps the keyboard (focusin→blur), so arrows still switch slides;
       YouTube's own controls appear on hover/pause. No cross-origin fullscreen trap. ── */
    .cinema-fill {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      z-index: 6000; border-radius: 0; background: #000;
    }
    /* .slide-song-image img sets position/z-index at equal specificity — restate the
       fill on img.cinema-fill (defined later → wins the tie). contain = sheet shown whole. */
    img.cinema-fill {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 6000;
      object-fit: contain; max-width: none; max-height: none; background: #000;
    }
    /* Reveal keeps transform + perspective on .slides; ANY of transform/perspective/
       filter on an ancestor traps position:fixed (it anchors to that ancestor, not the
       viewport). Neutralize them while cinema is on so the video truly fills the screen —
       the un-scaled slides underneath are fully covered by the cinema video, and Reveal
       re-applies its transform on exit (exitCinema → Reveal.layout()). */
    body.dc-cinema .reveal .slides,
    body.dc-cinema .reveal .slides > section.present {
      transform: none !important;
      perspective: none !important;
      filter: none !important;
    }
    /* clean screen while a video plays */
    body.dc-cinema .dc-filmstrip,
    body.dc-cinema .dc-corner-btns { display: none; }
    /* in cinema only the media shows — hide the slide's own chrome (label, fallback
       link, in-slide nav arrows) so nothing peeks over the full-screen video/image */
    body.dc-cinema .slide-video > *:not(.yt-embed),
    body.dc-cinema .slide-music > *:not(.yt-embed),
    body.dc-cinema .slide-song-image > *:not(.cinema-fill) { display: none; }
    /* overlay UI above the cinema video: edge nav arrows only (no caption) */
    .dc-cinema-ui { position: fixed; inset: 0; z-index: 6001; pointer-events: none; }
    .dc-cinema-ui[hidden] { display: none; }
    .dc-cinema-ui .slide-nav { pointer-events: auto; }   /* only arrows catch clicks; player stays clickable */

    /* Auto-hide interactive controls + cursor when the mouse sits still during the
       show (deck fullscreen). Any mouse/key/touch activity brings them back. The
       slide-caption stays; only the controls fade. */
    .dc-corner-btns { transition: opacity 0.3s; }
    body.dc-fs.dc-idle { cursor: none; }
    body.dc-fs.dc-idle .dc-cinema-ui .slide-nav,
    body.dc-fs.dc-idle .dc-corner-btns,
    body.dc-fs.dc-idle .info-music-btn { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides" id="dc-slides">
      <section><p class="dc-stub" style="padding:2rem">Загрузка…</p></section>
    </div>
  </div>

  <!-- Corner controls: start show (fullscreen + slide 1) · fullscreen toggle · hotkeys help -->
  <div class="dc-corner-btns">
    <button class="dc-corner-btn dc-play-btn" id="dc-play-btn" title="Начать показ (во весь экран)" aria-label="Начать показ"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M8.5 5 L19 12 L8.5 19 Z" fill="currentColor"/></svg></button>
    <button class="dc-corner-btn dc-fs-btn" id="dc-fs-btn" title="Полный экран (F)" aria-label="Полный экран">⛶</button>
    <button class="dc-corner-btn dc-help-btn" id="dc-help-btn" title="Горячие клавиши (?)" aria-label="Справка">?</button>
  </div>

  <!-- Hotkeys help panel (hidden by default) -->
  <div class="dc-help" id="dc-help" hidden>
    <div class="dc-help-card">
      <h3>Горячие клавиши</h3>
      <div class="dc-help-dl">
        <div><span class="dc-help-key">F</span><span class="dc-help-desc">полный экран</span></div>
        <div><span class="dc-help-key">← →</span><span class="dc-help-desc">переключение слайдов</span></div>
        <div><span class="dc-help-key">Esc</span><span class="dc-help-desc">обзор всех слайдов</span></div>
        <div><span class="dc-help-key">T</span><span class="dc-help-desc">лента слайдов</span></div>
        <div><span class="dc-help-key">?</span><span class="dc-help-desc">эта справка</span></div>
      </div>
      <button class="dc-help-close" id="dc-help-close">Закрыть</button>
    </div>
  </div>

  <!-- Slide filmstrip: visible in normal mode, auto-hidden in fullscreen, toggled by T -->
  <div class="dc-filmstrip" id="dc-filmstrip"></div>

  <!-- Cinema overlay: shown while a video plays — slide label + nav arrows over the video -->
  <div class="dc-cinema-ui" id="dc-cinema-ui" hidden>
    <button class="slide-nav slide-nav-prev" onclick="Reveal.prev()" aria-label="Предыдущий слайд" tabindex="-1">‹</button>
    <button class="slide-nav slide-nav-next" onclick="Reveal.next()" aria-label="Следующий слайд" tabindex="-1">›</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script type="module" src="boot.js"></script>
</body>
</html>
